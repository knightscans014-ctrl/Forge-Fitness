name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npx tsc` will silently fetch the unrelated `tsc@2.0.4` package if the
      # local TypeScript is ever missing, so always go through the script.
      - name: Type-check the app
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run engine unit tests
        run: npm test

  # Verifies the app actually bundles. tsc and jest both pass on code that
  # Metro then fails to resolve, so this is a distinct signal, not a
  # duplicate of the job above.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export the Android bundle
        run: npx expo export --platform android
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: dist/
          retention-days: 7
