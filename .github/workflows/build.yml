name: CI — test engine

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the app
        run: npx tsc --noEmit

      - name: Run engine unit tests
        run: npx jest

  # Optional: type-check + verify the app bundles (uncomment to enable)
