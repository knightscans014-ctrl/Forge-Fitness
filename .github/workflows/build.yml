name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npx tsc` will silently fetch the unrelated `tsc@2.0.4` package if the
      # local TypeScript is ever missing, so always go through the script.
      - name: Type-check the app
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run engine unit tests
        run: npm test

  # Optional: type-check + verify the app bundles (uncomment to enable)
  # bundle:
  #   runs-on: ubuntu-latest
  #   steps:
